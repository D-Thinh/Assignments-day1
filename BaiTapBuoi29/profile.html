<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Hồ sơ - Musicify</title>

        <link rel="stylesheet" href="./assets/css/reset.css" />

        <link rel="stylesheet" href="./assets/css/common.css" />

        <link rel="stylesheet" href="./assets/css/profile.css" />
    </head>

    <body>
        <div class="app">
            <!-- SIDEBAR -->

            <aside class="sidebar">
                <div class="logo">
                    <div class="logo-icon">♫</div>
                    <span>Musicify</span>
                </div>

                <nav class="main-menu">
                    <a href="./index.html" class="menu-item">
                        <span class="menu-icon">⌂</span>
                        <span>Trang chủ</span>
                    </a>

                    <a href="./search.html" class="menu-item">
                        <span class="menu-icon">⌕</span>
                        <span>Tìm kiếm</span>
                    </a>

                    <a href="./library.html" class="menu-item">
                        <span class="menu-icon">▣</span>
                        <span>Thư viện</span>
                    </a>
                </nav>

                <div class="playlist-section">
                    <div class="playlist-header">
                        <span>Playlist của bạn</span>

                        <button class="add-playlist-btn">+</button>
                    </div>

                    <div id="sidebar-playlists" class="playlist-list"></div>
                </div>

                <div class="sidebar-bottom">
                    <a href="./profile.html" class="menu-item active">
                        <span class="menu-icon">⚙</span>
                        <span>Cá nhân</span>
                    </a>

                    <button id="logout-btn" class="logout-btn">
                        <span>↪</span>
                        Đăng xuất
                    </button>
                </div>
            </aside>

            <!-- MAIN -->

            <main class="main-content">
                <header class="topbar">
                    <div class="navigation-buttons">
                        <button class="nav-btn">‹</button>
                        <button class="nav-btn">›</button>
                    </div>

                    <div class="user-area">
                        <button class="user-avatar">U</button>
                        <span id="user-name">User</span>
                        <span class="user-arrow">⌄</span>
                    </div>
                </header>

                <div class="content">
                    <section class="profile-page">
                        <div class="profile-cover"></div>

                        <div class="profile-header">
                            <div id="profile-avatar" class="profile-avatar">
                                U
                            </div>

                            <div class="profile-heading">
                                <span> Hồ sơ cá nhân </span>

                                <h1 id="profile-name">User Name</h1>

                                <p id="profile-email">user@example.com</p>
                            </div>
                        </div>

                        <div class="profile-content">
                            <div class="profile-section">
                                <h2>Thông tin cá nhân</h2>

                                <div class="profile-info-grid">
                                    <div class="profile-info-item">
                                        <span> Username </span>

                                        <strong id="profile-username">
                                            -
                                        </strong>
                                    </div>

                                    <div class="profile-info-item">
                                        <span> Email </span>

                                        <strong id="profile-email-detail">
                                            -
                                        </strong>
                                    </div>

                                    <div class="profile-info-item">
                                        <span> Quốc gia </span>

                                        <strong id="profile-country">
                                            -
                                        </strong>
                                    </div>

                                    <div class="profile-info-item">
                                        <span> Bio </span>

                                        <strong id="profile-bio"> - </strong>
                                    </div>
                                </div>
                            </div>

                            <div id="profile-loading" class="profile-loading">
                                Đang tải thông tin...
                            </div>

                            <div
                                id="profile-error"
                                class="form-message error hidden"
                            ></div>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </body>
</html>
