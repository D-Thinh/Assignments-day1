<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Musicify - Đăng ký</title>

        <link rel="stylesheet" href="../css/reset.css" />
        <link rel="stylesheet" href="../css/common.css" />
        <link rel="stylesheet" href="../css/auth.css" />
        <link rel="stylesheet" href="../css/register.css" />
    </head>

    <body>
        <main class="auth-page register-page">
            <div class="register-container">
                <section class="auth-card auth-card--wide">
                    <a href="./index.html" class="auth-logo register-logo">
                        <span class="auth-logo-icon register-logo-icon">♫</span>
                        <span>Musicify</span>
                    </a>

                    <div class="auth-header register-header">
                        <h1>Tạo tài khoản</h1>

                        <p>
                            Đăng ký để bắt đầu khám phá thế giới âm nhạc cùng
                            Musicify.
                        </p>
                    </div>

                    <form id="register-form" class="register-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="username">Username</label>

                                <input
                                    id="username"
                                    name="username"
                                    type="text"
                                    placeholder="Nhập username"
                                    required
                                />

                                <span
                                    id="username-error"
                                    class="field-error"
                                ></span>
                            </div>

                            <div class="form-group">
                                <label for="display-name">Tên hiển thị</label>

                                <input
                                    id="display-name"
                                    name="display_name"
                                    type="text"
                                    placeholder="Tên của bạn"
                                    required
                                />

                                <span
                                    id="display-name-error"
                                    class="field-error"
                                ></span>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">Email</label>

                            <input
                                id="email"
                                name="email"
                                type="email"
                                placeholder="you@example.com"
                                required
                            />

                            <span id="email-error" class="field-error"></span>
                        </div>

                        <!-- Password -->
                        <div class="form-group">
                            <label for="password">Mật khẩu</label>

                            <input
                                id="password"
                                name="password"
                                type="password"
                                placeholder="Nhập mật khẩu"
                                required
                            />

                            <span
                                id="password-error"
                                class="field-error"
                            ></span>
                        </div>

                        <!-- Country + Bio -->
                        <div class="form-row">
                            <div class="form-group">
                                <label for="country">Quốc gia</label>

                                <input
                                    id="country"
                                    name="country"
                                    type="text"
                                    placeholder="Vietnam"
                                    required
                                />

                                <span
                                    id="country-error"
                                    class="field-error"
                                ></span>
                            </div>

                            <div class="form-group">
                                <label for="bio">Bio</label>

                                <input
                                    id="bio"
                                    name="bio"
                                    type="text"
                                    placeholder="Một chút về bạn"
                                    required
                                />

                                <span id="bio-error" class="field-error"></span>
                            </div>
                        </div>

                        <!-- Button -->
                        <button
                            id="register-submit"
                            type="submit"
                            class="auth-submit register-submit"
                        >
                            Tạo tài khoản
                        </button>

                        <!-- API ERROR: PHẢI Ở ĐÂY -->
                        <div id="api-error" class="api-error" hidden></div>
                    </form>

                    <div class="auth-footer register-footer">
                        Đã có tài khoản?
                        <a href="./login.html"> Đăng nhập </a>
                    </div>
                </section>

                <div class="back-home">
                    <a href="../../../index.htmlßßß"> ← Quay lại trang chủ </a>
                </div>
            </div>
        </main>
        <script type="module" src="../lib/auth.js"></script>
    </body>
</html>
