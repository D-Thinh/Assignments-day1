<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DAY 5</title>
        <style>
            main {
                display: flex;
                padding: 50px 50px;
                display: flex;
                flex-wrap: wrap;
            }
            .h--content {
                display: inline-flex;
                flex-direction: column;
                margin-right: 50px;
                text-align: center;
            }
            .h1--display {
                width: 70px;
                height: 70px;
                border: 1px solid red;
            }
            .h2--display {
                width: 140px;
                height: 70px;
                border: 1px solid blue;
            }
            .h3--display {
                height: 0px;
                border-left: 50px solid transparent;
                border-right: 50px solid transparent;
                border-bottom: 90px solid #77cb81;
            }
            .h4--display {
                height: 0px;
                border-left: 60px solid transparent;
                border-right: 60px solid transparent;
                border-top: 90px solid #dfaa24;
            }
            .h5--display {
                height: 0px;
                border-top: 50px solid transparent;
                border-bottom: 50px solid transparent;
                border-right: 100px solid #9a1ce3;
            }
            .h6--display {
                height: 0px;
                border-top: 50px solid transparent;
                border-bottom: 50px solid transparent;
                border-left: 100px solid #e27b05;
            }
            .h7--display {
                height: 0px;
                width: 50px;
                border-left: 50px solid transparent;
                border-right: 50px solid transparent;
                border-top: 50px solid transparent;
                border-bottom: 50px solid rgb(0, 184, 129);
            }
            .h8--display {
                height: 0px;
                width: 0px;
                border: 50px solid;
                border-color: transparent transparent #14490a transparent;
            }
            .h9--display {
                width: 0px;
                border-left: 20px solid transparent;
                border-right: 20px solid transparent;
                border-bottom: 100px solid #aaa;
                border-color: transparent transparent #cd0947 transparent;
            }
            .h10--display {
                width: 0px;
                border-left: 40px solid transparent;
                border-right: 40px solid transparent;
                border-top: 50px solid transparent;
                border-bottom: 50px solid #c66210;
            }
            .h11--display {
                margin-top: auto;
                width: 0px;
                border-top: 30px solid transparent;
                border-bottom: 30px solid transparent;
                border-left: 50px solid #19c692;
            }
            .h12--display {
                margin-top: auto;
                margin-left: auto;
                width: 0px;
                border-top: 30px solid transparent;
                border-bottom: 30px solid transparent;
                border-right: 50px solid #ba0f9e;
            }
            .h13--display {
                height: 0px;
                width: 0px;
                border-width: 50px 90px;
                border-style: solid;
                border-color: #e0720b transparent #e0720b #e0720b;
            }
            footer {
                display: flex;
            }
            .first--logo {
                position: relative;
                .top--logo {
                    width: 60px;
                    height: 10px;
                    background-color: #c66210;
                    margin-right: 10px;
                }
                .top--logo__second {
                    position: absolute;
                    top: 50px;
                    left: 0px;
                    width: 60px;
                    height: 10px;
                    background-color: #c66210;
                    margin-right: 10px;
                }
                .b--logo {
                    width: 50px;
                    height: 100px;
                    border-left: 10px solid #c66210;
                }
            }
            .last--logo {
                margin-left: 20px;
                .top--logo {
                    width: 50px;
                    height: 40px;
                    border: 10px solid #c66210;
                }
                .b--logo {
                    width: 50px;
                    height: 40px;
                    border-bottom: 10px solid #c66210;
                    border-left: 10px solid #c66210;
                    border-right: 10px solid #c66210;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <div class="h--content">
                <div class="h1--display"></div>
                <p>1. Hình vuông</p>
            </div>

            <div class="h--content">
                <div class="h2--display"></div>
                <p>2. Hình chữ nhật</p>
            </div>
            <div class="h--content">
                <div class="h3--display"></div>
                <p>3. Tam giác lên</p>
            </div>
            <div class="h--content">
                <div class="h4--display"></div>
                <p>4. Tam giác xuống</p>
            </div>
            <div class="h--content">
                <div class="h5--display"></div>
                <p>5. Tam giác trái</p>
            </div>
            <div class="h--content">
                <div class="h6--display"></div>
                <p>6. Tam giác phải</p>
            </div>
            <div class="h--content">
                <div class="h7--display"></div>
                <p>7. Hình thang</p>
            </div>
            <div class="h--content">
                <div class="h8--display"></div>
                <p>8. Tam giác rộng</p>
            </div>
            <div class="h--content">
                <div class="h9--display"></div>
                <p>9. Tam giác nhọn</p>
            </div>
            <div class="h--content">
                <div class="h10--display"></div>
                <p>10. Tam giác cân</p>
            </div>
            <div class="h--content">
                <div class="h11--display"></div>
                <p>11. Mũi tên phải</p>
            </div>
            <div class="h--content">
                <div class="h12--display"></div>
                <p>12. Mũi tên trái</p>
            </div>
            <div class="h--content">
                <div class="h13--display"></div>
                <p>13. Ribbon/Lá cờ</p>
            </div>
        </main>
        <footer>
            <div class="first--logo">
                <div class="top--logo"></div>
                <div class="top--logo__second"></div>
                <div class="b--logo"></div>
            </div>
            <div class="last--logo">
                <div class="top--logo"></div>
                <div class="b--logo"></div>
            </div>
        </footer>
    </body>
</html>
